name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security policy unit tests
        run: npm run test:unit
      - name: Audit the full documentation toolchain
        run: |
          npm audit --json > dependency-audit.json || test -s dependency-audit.json
          node scripts/check-dependency-audit.mjs dependency-audit.json
      - name: Install released public parser for example validation
        run: npm i --ignore-scripts --prefix "$RUNNER_TEMP/flowstride-doc-validation" flowstride@1.0.23
      - name: Validate documentation and build
        env:
          FLOWSTRIDE_OS_ROOT: ${{ runner.temp }}/flowstride-doc-validation/node_modules/flowstride
        run: npm run check
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/flowstride-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.59.1
          node "$RUNNER_TEMP/flowstride-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - name: Browser regression
        env:
          FLOWSTRIDE_BROWSER_TOOLS: ${{ runner.temp }}/flowstride-browser-tools
        run: npm run test:browser
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            dependency-audit.json
            test-results/
          retention-days: 14
